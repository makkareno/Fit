<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16112e">
</head>
<body>
<!-- ARTIFACT:START -->
<title>Lucha Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: one column stacked like a lucha libre fight poster, fixed tab bar at the bottom of the "ring" */
:root {
  --noche: #16112e;
  --lona: #221b48;
  --lona-2: #2e2662;
  --cuerda: #463c8f;
  --rosa: #ff3d8b;
  --oro: #ffc93c;
  --turquesa: #2fe3c5;
  --rojo: #ff5a4f;
  --tinta: #f7f2ff;
  --tinta-2: #b9b0dc;
  --sombra: #0a0718;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem;
  --t-xs: .78rem; --t-sm: .9rem; --t-md: 1rem; --t-lg: 1.25rem; --t-xl: 1.7rem; --t-2xl: 2.4rem;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--noche);
  background-image: radial-gradient(rgba(185, 176, 220, .07) 1px, transparent 1.5px);
  background-size: 14px 14px;
  color: var(--tinta);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

#app {
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--s-4) 7rem;
  display: flex;
  flex-direction: column;
  gap: var(--s-5);
}
#app.ob { padding-bottom: var(--s-6); }

/* ---------- type ---------- */
.poster {
  font-family: var(--f-display);
  line-height: .95;
  letter-spacing: .01em;
  text-shadow: 3px 3px 0 var(--rosa), 6px 6px 0 var(--sombra);
}
.eyebrow {
  font-family: var(--f-label);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: var(--t-xs);
  color: var(--oro);
}
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; }
.sec-title { font-family: var(--f-display); font-size: var(--t-lg); font-weight: 400; }
.muted { color: var(--tinta-2); }
.small { font-size: var(--t-sm); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  font-family: var(--f-label); font-weight: 800; font-size: var(--t-lg);
  text-transform: uppercase; letter-spacing: .06em;
  padding: .7rem 1.2rem;
  background: var(--rosa); color: var(--tinta);
  border: 2px solid var(--sombra); border-radius: 6px;
  box-shadow: 4px 4px 0 var(--sombra);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--sombra); }
.btn.oro { background: var(--oro); color: var(--sombra); }
.btn.turq { background: var(--turquesa); color: var(--sombra); }
.btn.ghost { background: var(--lona-2); color: var(--tinta); }
.btn.sm { font-size: var(--t-md); padding: .45rem .8rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; color: var(--tinta-2); text-decoration: underline; padding: var(--s-2); font-size: var(--t-sm); }

.panel {
  background: var(--lona);
  border: 2px solid var(--cuerda);
  border-radius: 6px;
  padding: var(--s-4);
  box-shadow: 4px 4px 0 var(--sombra);
}

/* ---------- header ---------- */
.top { display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-3); align-items: center; }
.top .mini { width: 52px; height: 57px; }
.top .who { min-width: 0; }
.top .name { font-family: var(--f-display); font-size: var(--t-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .rank { font-family: var(--f-label); font-weight: 700; font-size: var(--t-sm); color: var(--tinta-2); text-transform: uppercase; letter-spacing: .08em; }
.xpbar { height: 10px; background: var(--sombra); border-radius: 3px; overflow: hidden; margin-top: 4px; border: 1px solid var(--cuerda); }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--turquesa), var(--oro)); transition: width .5s; }
.xptext { font-family: var(--f-label); font-size: var(--t-xs); color: var(--tinta-2); margin-top: 2px; }
.badge-lvl {
  display: grid; place-items: center; text-align: center;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--oro); color: var(--sombra);
  border: 3px solid var(--sombra); box-shadow: 3px 3px 0 var(--sombra);
  font-family: var(--f-label); font-weight: 800; line-height: 1;
}
.badge-lvl b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 400; display: block; }
.badge-lvl span { font-size: .62rem; letter-spacing: .1em; }

.streak-strip { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-label); font-weight: 700; font-size: var(--t-sm);
  text-transform: uppercase; letter-spacing: .06em;
  background: var(--lona-2); border: 1px solid var(--cuerda); border-radius: 999px;
  padding: .25rem .7rem;
}
.chip svg { width: 16px; height: 16px; }
.chip.fire { color: var(--oro); }

/* ---------- notices ---------- */
.notice {
  display: flex; gap: var(--s-3); align-items: flex-start;
  background: var(--sombra); border: 2px dashed var(--rojo); border-radius: 6px;
  padding: var(--s-3) var(--s-4);
}
.notice p { flex: 1; min-width: 0; font-size: var(--t-sm); }
.notice b { color: var(--rojo); }
.notice button { background: none; border: 0; color: var(--tinta-2); font-size: 1.2rem; line-height: 1; padding: 0 4px; }

/* ---------- fight card ---------- */
.cartel {
  position: relative;
  border: 3px solid var(--oro);
  border-radius: 6px;
  box-shadow: 6px 6px 0 var(--sombra);
  background:
    repeating-linear-gradient(-45deg, transparent 0 18px, rgba(255, 201, 60, .05) 18px 36px),
    linear-gradient(180deg, var(--lona-2), var(--lona));
  padding: var(--s-4);
  display: flex; flex-direction: column; gap: var(--s-3);
  overflow: hidden;
}
.cartel-top { display: flex; justify-content: space-between; gap: var(--s-2); flex-wrap: wrap; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: var(--s-2); }
.fighter { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--s-2); position: relative; min-width: 0; }
.fighter svg { width: 100%; max-width: 132px; height: auto; filter: drop-shadow(4px 5px 0 var(--sombra)); }
.fighter figcaption {
  font-family: var(--f-display); font-size: var(--t-sm); text-align: center; line-height: 1.1;
  overflow-wrap: anywhere;
}
.fighter.boss figcaption { color: var(--rojo); }
.vs {
  font-family: var(--f-display); font-size: var(--t-2xl); color: var(--oro);
  text-shadow: 3px 3px 0 var(--rosa), 5px 5px 0 var(--sombra);
  align-self: center; transform: rotate(-8deg);
}
.boss-bio { font-size: var(--t-sm); color: var(--tinta-2); text-align: center; }
.hp-label { display: flex; justify-content: space-between; font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: var(--t-sm); }
.hp-bar { height: 20px; background: var(--sombra); border: 2px solid var(--sombra); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.hp-bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--rojo) 0 14px, #ff7a52 14px 16px); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.hp-note { font-size: var(--t-xs); color: var(--tinta-2); text-align: center; }
.stamp {
  position: absolute; left: 50%; top: 42%;
  transform: translate(-50%, -50%) rotate(-14deg);
  font-family: var(--f-display); font-size: 1.35rem; color: var(--oro);
  border: 4px solid var(--oro); padding: .2rem .6rem; border-radius: 4px;
  background: rgba(10, 7, 24, .78); white-space: nowrap;
  text-shadow: 2px 2px 0 var(--rosa);
}
.fighter.hit svg { animation: shake .5s; }
.dmg-float {
  position: absolute; top: 10%; left: 50%;
  font-family: var(--f-display); font-size: var(--t-xl); color: var(--oro);
  text-shadow: 2px 2px 0 var(--sombra);
  animation: floatUp 1.2s forwards; pointer-events: none;
}
@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-8px) rotate(-6deg); }
  40% { transform: translateX(7px) rotate(5deg); }
  60% { transform: translateX(-5px) rotate(-3deg); }
  80% { transform: translateX(3px) rotate(2deg); }
}
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1.1); } to { opacity: 0; transform: translate(-50%, -60px) scale(.9); } }

/* ---------- retos ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s-3); }
.reto {
  display: grid; grid-template-columns: 4.2rem 1fr auto; gap: var(--s-3); align-items: center;
  background: var(--lona); border: 2px solid var(--cuerda); border-radius: 6px;
  padding: var(--s-3);
}
.reto.done { border-color: var(--turquesa); background: color-mix(in srgb, var(--turquesa) 10%, var(--lona)); }
.reto-amt { text-align: center; font-family: var(--f-display); font-size: var(--t-xl); line-height: 1; color: var(--oro); }
.reto-amt small { display: block; font-family: var(--f-label); font-size: var(--t-xs); font-weight: 700; color: var(--tinta-2); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
.reto-txt { min-width: 0; }
.reto-txt b { display: block; font-family: var(--f-label); font-weight: 800; font-size: var(--t-lg); line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; }
.reto-txt span { display: block; font-size: var(--t-sm); color: var(--tinta-2); }
.check {
  width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid var(--cuerda); background: var(--sombra);
  display: grid; place-items: center; transition: transform .1s;
}
.check svg { width: 24px; height: 24px; stroke: var(--cuerda); }
.check:active { transform: scale(.9); }
.reto.done .check { background: var(--turquesa); border-color: var(--sombra); }
.reto.done .check svg { stroke: var(--sombra); }
.combo { display: flex; align-items: center; gap: var(--s-3); font-size: var(--t-sm); color: var(--tinta-2); }
.combo-dots { display: flex; gap: 4px; }
.combo-dots i { width: 14px; height: 14px; border-radius: 3px; background: var(--sombra); border: 2px solid var(--cuerda); transform: rotate(45deg); }
.combo-dots i.on { background: var(--oro); border-color: var(--oro); }

.profe { display: grid; grid-template-columns: auto 1fr; gap: var(--s-3); align-items: center; }
.profe .whistle { width: 44px; height: 44px; border-radius: 50%; background: var(--turquesa); display: grid; place-items: center; border: 2px solid var(--sombra); }
.profe .whistle svg { width: 24px; height: 24px; }
.profe q { font-size: var(--t-md); font-style: italic; quotes: "“" "”"; }

/* ---------- heatmap ---------- */
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.heat .dow { font-family: var(--f-label); font-weight: 700; font-size: var(--t-xs); text-align: center; color: var(--tinta-2); }
.heat .c { aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--sombra); border: 1px solid var(--lona-2); }
.heat .c.l1 { background: color-mix(in srgb, var(--rosa) 35%, var(--sombra)); }
.heat .c.l2 { background: color-mix(in srgb, var(--rosa) 70%, var(--sombra)); }
.heat .c.l3 { background: var(--oro); border-color: var(--oro); }
.heat .c.today { outline: 2px solid var(--tinta); outline-offset: 1px; }
.heat .c.future { opacity: .25; }
.legend { display: flex; gap: var(--s-2); align-items: center; font-size: var(--t-xs); color: var(--tinta-2); justify-content: flex-end; margin-top: var(--s-2); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- combates ---------- */
.combate { display: flex; flex-direction: column; gap: var(--s-3); }
.combate h3 { font-family: var(--f-display); font-size: var(--t-lg); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.ex-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-list span { font-size: var(--t-xs); font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--sombra); padding: 2px 8px; border-radius: 3px; color: var(--tinta-2); }
.reward { font-family: var(--f-label); font-weight: 800; color: var(--oro); letter-spacing: .04em; text-transform: uppercase; }

/* ---------- ruleta ---------- */
.wheel-wrap { position: relative; width: min(100%, 330px); margin: 0 auto; aspect-ratio: 1; max-width: 100%; }
.wheel-wrap canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(5px 6px 0 var(--sombra)); }
.pointer {
  position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 16px solid transparent; border-right: 16px solid transparent;
  border-top: 30px solid var(--oro);
  filter: drop-shadow(2px 3px 0 var(--sombra));
}
.hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--sombra); border: 4px solid var(--oro);
  display: grid; place-items: center;
  font-family: var(--f-display); font-size: .7rem; color: var(--oro); text-align: center; line-height: 1;
}
.result { text-align: center; display: flex; flex-direction: column; gap: var(--s-3); align-items: center; }
.result .big { font-family: var(--f-display); font-size: var(--t-2xl); color: var(--oro); line-height: 1; }
.btn-row { display: flex; gap: var(--s-3); flex-wrap: wrap; justify-content: center; }

/* ---------- vestidor ---------- */
.ritual {
  display: grid; grid-template-columns: 1fr auto; gap: var(--s-3); align-items: center;
  padding: var(--s-3) 0; border-bottom: 1px solid var(--lona-2);
}
.ritual:last-child { border-bottom: 0; }
.ritual b { display: block; font-family: var(--f-label); font-weight: 800; font-size: var(--t-lg); text-transform: uppercase; line-height: 1.1; }
.ritual span { font-size: var(--t-sm); color: var(--tinta-2); }
.ritual.done b { color: var(--turquesa); }
.ritual > div { min-width: 0; }
.vasos { display: flex; align-items: center; gap: var(--s-2); }
.vasos .count { font-family: var(--f-display); min-width: 3.2ch; text-align: center; }
.round-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--lona-2); border: 2px solid var(--cuerda); font-weight: 700; font-size: 1.2rem; line-height: 1; }
.glasses { display: flex; gap: 3px; margin-top: 4px; }
.glasses i { width: 10px; height: 14px; border: 2px solid var(--cuerda); border-top: 0; border-radius: 0 0 3px 3px; }
.glasses i.on { background: var(--turquesa); border-color: var(--turquesa); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
.stat { background: var(--sombra); border-radius: 6px; padding: var(--s-3); text-align: center; }
.stat b { display: block; font-family: var(--f-display); font-size: var(--t-xl); font-weight: 400; line-height: 1; color: var(--oro); }
.stat span { font-family: var(--f-label); font-weight: 700; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-2); }

.trophies { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3); }
.trophy { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.trophy svg { width: 100%; max-width: 72px; height: auto; }
.trophy span { font-family: var(--f-label); font-weight: 700; font-size: var(--t-xs); line-height: 1.1; overflow-wrap: anywhere; }
.trophy.empty svg { opacity: .18; filter: grayscale(1); }
.trophy.empty span { color: var(--tinta-2); }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--s-3); }
.badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.badge .medal {
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--oro); color: var(--sombra);
  border: 3px solid var(--sombra); box-shadow: 0 0 0 2px var(--oro);
  font-family: var(--f-display); font-size: .95rem;
}
.badge.locked .medal { background: var(--sombra); color: var(--cuerda); box-shadow: 0 0 0 2px var(--cuerda); }
.badge b { font-family: var(--f-label); font-weight: 800; font-size: var(--t-sm); text-transform: uppercase; line-height: 1.05; }
.badge span { font-size: var(--t-xs); color: var(--tinta-2); line-height: 1.2; }
.badge.locked b { color: var(--tinta-2); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.seg button {
  background: var(--sombra); border: 2px solid var(--cuerda); border-radius: 6px;
  padding: var(--s-2); font-family: var(--f-label); font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
}
.seg button.on { background: var(--oro); color: var(--sombra); border-color: var(--sombra); }

/* ---------- mask editor ---------- */
.mask-editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: var(--s-4); align-items: center; }
.mask-preview svg { width: 100%; height: auto; filter: drop-shadow(5px 6px 0 var(--sombra)); }
.mask-opts { display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.sw { width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 3px solid var(--sombra); box-shadow: 0 0 0 2px var(--cuerda); padding: 0; }
.sw.on { box-shadow: 0 0 0 3px var(--oro); transform: scale(1.08); }
.emblems { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.em { width: 40px; height: 40px; border-radius: 6px; background: var(--sombra); border: 2px solid var(--cuerda); padding: 4px; display: grid; place-items: center; }
.em svg { width: 100%; height: 100%; }
.em.on { border-color: var(--oro); background: var(--lona-2); }
@media (max-width: 420px) {
  .mask-editor { grid-template-columns: 1fr; }
  .mask-preview { width: 60%; margin: 0 auto; }
}

/* ---------- onboarding ---------- */
.ob-hero { text-align: center; display: flex; flex-direction: column; gap: var(--s-4); align-items: center; padding-top: var(--s-5); }
.ob-hero .title { font-size: clamp(3rem, 16vw, 5rem); }
.ob-hero .title span { display: block; color: var(--oro); }
.ob-hero .lede { font-size: var(--t-lg); max-width: 26ch; }
.ob-hero .duo { display: flex; justify-content: center; align-items: end; gap: var(--s-2); width: 100%; max-width: 360px; }
.ob-hero .duo svg { width: 42%; height: auto; filter: drop-shadow(5px 6px 0 var(--sombra)); }
.ob-hero .duo .vs { font-size: var(--t-xl); }
.how { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s-2); text-align: left; width: 100%; }
.how li { display: grid; grid-template-columns: 2rem 1fr; gap: var(--s-2); align-items: start; font-size: var(--t-sm); }
.how li b { font-family: var(--f-display); color: var(--rosa); font-size: var(--t-lg); line-height: 1; }
.steps { display: flex; gap: 6px; justify-content: center; }
.steps i { width: 26px; height: 6px; border-radius: 3px; background: var(--lona-2); }
.steps i.on { background: var(--oro); }
.ob-step { display: flex; flex-direction: column; gap: var(--s-4); }
.ob-step h2 { font-size: var(--t-xl); }
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.field input {
  width: 100%; font-family: var(--f-display); font-size: var(--t-lg);
  padding: .7rem .8rem; background: var(--sombra); color: var(--tinta);
  border: 2px solid var(--cuerda); border-radius: 6px;
}
.diff-cards { display: grid; gap: var(--s-3); }
.diff-card {

/* ================= state & storage ================= */
const LS_KEY = "luchafit.v1";
let S = null;          // game state
let OB = null;         // onboarding draft
let TAB = "arena";
let notices = [];
let lastHit = null;
let remote = null, writing = false, dirty = false, saveTimer = null;

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function save() {
  if (!S) return;
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento local */ }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush() {
  if (!remote || !S) return;
  if (writing) { dirty = true; return; }
  writing = true;
  try {
    await remote.set(JSON.parse(JSON.stringify(S)));
  } catch (e) {
    if (e && e.code === "unavailable") setTimeout(flush, 1500 + Math.random() * 1500);
  }
  writing = false;
  if (dirty) { dirty = false; flush(); }
}
async function connectRemote() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection("data/users/" + id).doc("luchafit");
    const snap = await ref.get();
    remote = ref;
    const data = snap.exists ? snap.data() : null;
    if (data && data.profile && (!S || (data.updatedAt || 0) > (S.updatedAt || 0))) {
      S = migrate(structuredClone(data));
      notices = [];
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
      boot();
    } else if (S) {
      flush();
    }
  } catch (e) { /* sin nube: se queda en este dispositivo */ }
}
function migrate(s) {
  s.days = s.days || {};
  s.masks = s.masks || [];
  s.totals = Object.assign({ retos: 0, rounds: 0, spins: 0, rituales: 0, combos: 0 }, s.totals || {});
  s.flags = s.flags || {};
  s.badges = s.badges || {};
  s.bestStreak = s.bestStreak || 0;
  s.losses = s.losses || 0;
  return s;
}
function newState(p) {
  return migrate({ v: 1, profile: p, xp: 0, days: {}, boss: null, masks: [], losses: 0, bestStreak: 0, updatedAt: Date.now() });
}
function day(k = today()) {
  if (!S.days[k]) S.days[k] = { xp: 0, dmg: 0, retos: [0, 0, 0], rit: {}, agua: 0, rounds: 0, spins: 0 };
  return S.days[k];
}
function retoSpec() {
  const d = day();
  if (!d.spec) {
    const r = rng("retos" + today());
    const lvl = levelInfo(S.xp).lvl;
    const scale = 1 + Math.min(0.6, (lvl - 1) * 0.04);
    d.spec = POOLS.map(pool => {
      const ex = pick(pool, r);
      return { ex, amt: roundAmt(EX[ex].amt[S.profile.diff] * scale) };
    });
  }
  return d.spec;
}
function streak() {
  let k = today();
  if (!(S.days[k] && S.days[k].xp > 0)) k = addDays(k, -1);
  let n = 0;
  while (S.days[k] && S.days[k].xp > 0) { n++; k = addDays(k, -1); }
  return n;
}

/* ================= boss ================= */
function ensureBoss() {
  const t = today();
  const wk = weekStart(t);
  const old = S.boss;
  if (!old || old.week !== wk) {
    if (old && !old.defeated) {
      S.losses++;
      notices.push(`<b>${esc(BOSSES[old.idx].name)}</b> se escapó con su máscara la semana pasada. Esta semana no se te va nadie.`);
    }
    const idx = old ? (old.idx + 1) % BOSSES.length : 0;
    const max = HP[S.profile.diff] + S.masks.length * 150;
    S.boss = { week: wk, idx, hp: max, max, defeated: false, healedThrough: addDays(wk, -1) };
  }
  const b = S.boss;
  const y = addDays(t, -1);
  let healed = 0;
  for (let k = addDays(b.healedThrough, 1); k <= y; k = addDays(k, 1)) {
    if (k < b.week || k < S.profile.start || b.defeated) continue;
    if (!(S.days[k] && S.days[k].xp > 0)) {
      const before = b.hp;
      b.hp = Math.min(b.max, b.hp + Math.round(b.max * HEAL));
      healed += b.hp - before;
    }
  }
  if (y > b.healedThrough) b.healedThrough = y;
  if (healed > 0) notices.push(`Mientras no entrenabas, <b>${esc(BOSSES[b.idx].name)}</b> se recuperó <b>+${fmt(healed)}</b> de aguante.`);
  const cutoff = addDays(t, -70);
  for (const k of Object.keys(S.days)) if (k < cutoff) delete S.days[k];
}

function hitBoss(dmg) {
  const b = S.boss;
  if (!b || b.defeated || dmg <= 0) return;
  b.hp = Math.max(0, b.hp - dmg);
  lastHit = { dmg, t: Date.now() };
  if (b.hp === 0) {
    b.defeated = true;
    S.masks.push({ idx: b.idx, week: b.week });
    S.xp += 300;
    day().xp += 300;
    const boss = BOSSES[b.idx];
    queueModal({
      eyebrow: "Lucha de apuestas",
      title: `¡Le quitaste la máscara a ${boss.name}!`,
      art: maskSVG(boss, { angry: true, cls: "m", title: boss.name }),
      body: "Su máscara ya cuelga en tu vestidor. +300 XP. El lunes llega un rudo nuevo, más duro.",
      cta: "¡Viva el campeón!",
      confetti: true
    });
  }
}

/* ================= rewards ================= */
function applyGain(xp, dmg, label) {
  const d = day();
  const before = levelInfo(S.xp).lvl;
  S.xp += xp; d.xp += xp; d.dmg += dmg;
  hitBoss(dmg);
  if (new Date().getHours() < 8) S.flags.madrugador = true;
  S.bestStreak = Math.max(S.bestStreak, streak());
  toast(`+${xp} XP${dmg ? ` · ${dmg} golpes` : ""}${label ? ` · ${label}` : ""}`);
  const after = levelInfo(S.xp).lvl;
  if (after > before) {
    const newRank = rankOf(after) !== rankOf(before);
    queueModal({
      eyebrow: "Subiste de nivel",
      title: `¡Nivel ${after}!`,
      art: maskSVG(S.profile.mask, { cls: "m", title: S.profile.name }),
      body: newRank ? `Nuevo rango: <b>${rankOf(after)}</b>. La afición empieza a corear tu nombre.` : "Cada nivel sube un poquito tus retos diarios. Así se hacen los campeones.",
      cta: "A seguirle",
      confetti: newRank
    });
  }
  checkBadges();
  save();
}
function revokeGain(xp, dmg) {
  const d = day();
  S.xp = Math.max(0, S.xp - xp);
  d.xp = Math.max(0, d.xp - xp);
  d.dmg = Math.max(0, d.dmg - dmg);
  if (S.boss && !S.boss.defeated) S.boss.hp = Math.min(S.boss.max, S.boss.hp + dmg);
  toast(`−${xp} XP · deshecho`, "bad");
  save();
}
function checkBadges() {
  for (const b of BADGES) {
    if (!S.badges[b.id] && b.test(S)) {
      S.badges[b.id] = today();
      setTimeout(() => toast(`Logro: ${b.name}`, "cool"), 500);
    }
  }
}

function confetti() {
  if (reduceMotion()) return;
  const cv = $("#confetti");
  cv.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--rosa", "--oro", "--turquesa", "--tinta"].map(v => css.getPropertyValue(v).trim());
  const ps = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (t - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

function beep(f = 880, d = .12, vol = .12, type = "square") {
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, a.currentTime);

  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d + .02);
}

function wireOath() {
  const btn = $("#oath"), fill = btn.querySelector(".fill"), label = btn.querySelector("span");
  let start = 0, raf = 0;
  const DUR = 1600;
  const step = t => {
    const p = Math.min(1, (t - start) / DUR);
    fill.style.width = (p * 100) + "%";
    if (p >= 1) { finishOnboarding(); return; }
    raf = requestAnimationFrame(step);
  };
  const down = e => { e.preventDefault(); if (start) return; audio(); start = performance.now(); label.textContent = "Jurando…"; raf = requestAnimationFrame(step); };
  const up = () => { if (!start) return; cancelAnimationFrame(raf); start = 0; fill.style.width = "0"; label.textContent = "Mantén presionado para jurar"; };
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointerleave", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) down(e); });
  btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") up(); });
}

function adjusted(c) {
  const d = S.profile.diff;
  return { work: c.work + [-10, 0, 5][d], rest: c.rest + [5, 0, -5][d] };
}
function buildSteps(c) {
  const { work, rest } = adjusted(c);
  const steps = [{ kind: "prep", dur: 10, ex: c.ex[0], r: 0, i: 0 }];
  for (let r = 0; r < c.rounds; r++) {
    c.ex.forEach((e, i) => {
      steps.push({ kind: "work", dur: work, ex: e, r, i });
      const last = i === c.ex.length - 1;
      if (!last) steps.push({ kind: "rest", dur: rest, ex: c.ex[i + 1], r, i: i + 1 });
      else if (r < c.rounds - 1) steps.push({ kind: "rest", dur: 45, ex: c.ex[0], r: r + 1, i: 0, between: true });
    });
  }
  return steps;
}

let T = null;
let wakeLock = null;
async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; } }
function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) { /* ignore */ } wakeLock = null; }

function startCombate(id) {
  const c = COMBATES.find(x => x.id === id);
  if (!c) return;
  audio();
  T = { c, steps: buildSteps(c), idx: 0, endAt: 0, left: 0, paused: false, lastSec: null, done: false, iv: 0 };
  $("#timer").hidden = false;
  document.body.style.overflow = "hidden";
  lockScreen();
  enterStep(0);
  T.iv = setInterval(tick, 200);
}
function enterStep(i) {
  T.idx = i;
  const s = T.steps[i];
  T.endAt = Date.now() + s.dur * 1000;
  T.lastSec = null;
  if (s.kind === "work") { bell(); buzz([120, 60, 120]); }
  else if (s.kind === "rest") { beep(440, .25, .12, "triangle"); buzz(200); }
  renderTimer();
}
function tick() {
  if (!T || T.paused || T.done) return;
  const ms = T.endAt - Date.now();
  const sec = Math.max(0, Math.ceil(ms / 1000));
  if (sec !== T.lastSec) {
    T.lastSec = sec;
    if (sec <= 3 && sec > 0) beep(880, .1);
    updateTimerNumbers(sec);
  }
  if (ms <= 0) {
    if (T.idx + 1 < T.steps.length) enterStep(T.idx + 1);
    else finishCombate();
  }
}
function updateTimerNumbers(sec) {
  const s = T.steps[T.idx];
  const el = $("#t-secs"); if (el) el.textContent = sec;
  const ring = $("#t-ring");
  if (ring) {
    const C = 2 * Math.PI * 54;
    const p = s.dur ? sec / s.dur : 0;
    ring.style.strokeDashoffset = (C * (1 - p)).toFixed(2);
  }
}
function renderTimer() {
  const s = T.steps[T.idx], c = T.c, e = EX[s.ex];
  const phase = s.kind === "work" ? { t: "¡A darle!", c: "var(--rosa)" } : s.kind === "rest" ? { t: s.between ? "Esquina" : "Descanso", c: "var(--turquesa)" } : { t: "Prepárate", c: "var(--oro)" };
  const next = T.steps.slice(T.idx + 1).find(x => x.kind === "work");
  const C = 2 * Math.PI * 54;
  const workSteps = T.steps.filter(x => x.kind === "work").length;
  const doneWork = T.steps.slice(0, T.idx + (s.kind === "work" ? 1 : 0)).filter(x => x.kind === "work").length;
  $("#timer").innerHTML = `<div class="t-inner" style="--ph:${phase.c}">
    <div class="t-top"><span class="phase">${phase.t}</span><span class="eyebrow num">Vuelta ${s.r + 1}/${c.rounds} · ${doneWork}/${workSteps}</span></div>
    <span class="eyebrow">${esc(c.name)}</span>
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--lona-2)" stroke-width="10"/><circle id="t-ring" cx="60" cy="60" r="54" fill="none" stroke="${phase.c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="0" style="transition:stroke-dashoffset .25s linear"/></svg>
      <div class="secs" id="t-secs">${s.dur}</div>
    </div>
    <div>${s.kind === "work" ? "" : `<span class="eyebrow">Sigue</span>`}
      <div class="t-ex poster">${e.name}</div>
      <div class="t-real">${e.real}</div>
    </div>
    <p class="t-tip">${e.tip}</p>
    ${s.kind === "work" && next ? `<p class="t-next">Después: <b>${EX[next.ex].real}</b></p>` : ""}
    <div class="t-controls">
      <button class="btn ghost sm" data-act="t-pause">${T.paused ? "Seguir" : "Pausa"}</button>
      <button class="btn ghost sm" data-act="t-skip">Saltar</button>
      <button class="btn sm" data-act="t-quit" style="background:var(--rojo)">Rendirme</button>
    </div>
  </div>`;
  updateTimerNumbers(Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000)));
}
function finishCombate() {
  clearInterval(T.iv);
  T.done = true;
  bell(); setTimeout(bell, 350); setTimeout(bell, 700);
  buzz([200, 100, 200, 100, 400]);

const R = { angle: 0, spinning: false, result: null };
function wheelSegments() {
  const r = rng("ruleta" + today());
  const all = Object.keys(EX).filter(k => k !== "caminata");
  const segs = [];
  while (segs.length < 8) {
    const k = pick(all, r);
    if (segs.some(s => s.ex === k)) continue;
    segs.push({ ex: k, amt: roundAmt(EX[k].amt[S.profile.diff] * 0.6) });
  }
  return segs;
}

  </section>

  <button class="btn oro block" data-act="spin" ${R.spinning || (res && !R.spinning) ? "disabled" : ""}>${R.spinning ? "Girando…" : "Girar la ruleta"}</button>
  ${resHTML}`;
}
function drawWheel() {
  const cv = $("#wheel");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, cx = W / 2, rad = W / 2 - 8;
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  const fills = [v("--rosa"), v("--lona-2"), v("--oro"), v("--cuerda"), v("--turquesa"), v("--lona-2"), v("--rojo"), v("--cuerda")];
  const dark = [false, false, true, false, true, false, false, false];
  const segs = wheelSegments();
  const seg = Math.PI * 2 / segs.length;
  const base = -Math.PI / 2 + R.angle * Math.PI / 180;
  ctx.clearRect(0, 0, W, W);
  ctx.beginPath(); ctx.arc(cx, cx, rad + 6, 0, Math.PI * 2); ctx.fillStyle = v("--sombra"); ctx.fill();
  segs.forEach((s, i) => {
    const a0 = base + i * seg;
    ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, rad, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = fills[i]; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = v("--sombra"); ctx.stroke();
    ctx.save();
    ctx.translate(cx, cx); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = dark[i] ? v("--sombra") : v("--tinta");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `400 30px ${v("--f-display")}`;
    ctx.fillText(String(s.amt), rad * .72, -12);
    ctx.font = `800 23px ${v("--f-label")}`;
    ctx.fillText(EX[s.ex].short.toUpperCase(), rad * .6, 18);
    ctx.restore();
  });
}
function spin() {
  if (R.spinning || !S) return;
  audio();
  const segs = wheelSegments();
  const i = Math.floor(Math.random() * segs.length);
  const segDeg = 360 / segs.length;
  const a0 = R.angle;
  const target = -(i + .5) * segDeg + (Math.random() - .5) * segDeg * .6;
  let delta = ((target - a0) % 360 + 360) % 360;
  delta += 360 * 5;
  const paid = day().spins < 3;
  R.spinning = true; R.result = null;
  renderApp();
  const dur = reduceMotion() ? 300 : 4200;
  const t0 = performance.now();
  let lastSeg = null;
  const ease = t => 1 - Math.pow(1 - t, 4);
  (function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    R.angle = a0 + delta * ease(p);
    const cur = Math.floor(((R.angle % 360) + 360) % 360 / segDeg);
    if (cur !== lastSeg) { lastSeg = cur; beep(1200, .03, .05); }
    drawWheel();
    if (p < 1) { requestAnimationFrame(frame); return; }
    R.angle = ((R.angle % 360) + 360) % 360;
    R.spinning = false;
    R.result = { ...segs[i], paid };
    bell();
    if (TAB === "ruleta") renderApp();
  })(t0);
}

  "mask": b => {
    const target = b.dataset.scope === "ob" ? OB.mask : S.profile.mask;
    target[b.dataset.k] = b.dataset.v;
    if (b.dataset.scope === "ob") renderOnboarding();
    else { save(); renderApp(); }
  },
  "reto": b => {
    const i = +b.dataset.i, d = day();
    retoSpec();
    if (d.retos[i]) {
      d.retos[i] = 0; S.totals.retos = Math.max(0, S.totals.retos - 1);
      let xp = 50, dmg = 70;
      if (d.combo) { d.combo = false; S.totals.combos = Math.max(0, S.totals.combos - 1); xp += 50; dmg += 60; }
      revokeGain(xp, dmg);
    } else {
      d.retos[i] = 1; S.totals.retos++;
      let xp = 50, dmg = 70, label = "";
      if (d.retos.every(Boolean) && !d.combo) { d.combo = true; S.totals.combos++; xp += 50; dmg += 60; label = "¡COMBO!"; buzz([80, 40, 80]); }
      audio(); beep(660, .08); setTimeout(() => beep(990, .12), 90);
      applyGain(xp, dmg, label);
    }
    renderApp();
  },
  "ritual": b => {
    const id = b.dataset.id, d = day();
    if (d.rit[id]) { d.rit[id] = false; S.totals.rituales = Math.max(0, S.totals.rituales - 1); revokeGain(15, 20); }
    else { d.rit[id] = true; S.totals.rituales++; checkRitualFlags(d); applyGain(15, 20, "ritual"); }
    renderApp();
  },
  "agua": b => {
    const d = day();
    const n = Math.max(0, Math.min(8, d.agua + (+b.dataset.d)));
    if (n === d.agua) return;
    const was = d.agua >= 8;
    d.agua = n;
    if (!was && n >= 8) { d.rit.agua = true; S.totals.rituales++; S.flags.agua = true; checkRitualFlags(d); applyGain(15, 20, "hidratado"); }
    else if (was && n < 8) { d.rit.agua = false; S.totals.rituales = Math.max(0, S.totals.rituales - 1); revokeGain(15, 20); }
    else save();
    renderApp();
  },
  "combate": b => startCombate(b.dataset.id),
  "t-pause": () => {
    if (!T) return;
    if (T.paused) { T.endAt = Date.now() + T.left; T.paused = false; }
    else { T.left = T.endAt - Date.now(); T.paused = true; }
    renderTimer();
    if (T.paused) updateTimerNumbers(Math.ceil(T.left / 1000));
  },
  "t-skip": () => {
    if (!T) return;
    if (T.idx + 1 < T.steps.length) { T.paused = false; enterStep(T.idx + 1); } else finishCombate();
  },
  "t-quit": b => armConfirm(b, "¿Seguro? Toca otra vez", () => { toast("Te rendiste. El rudo se ríe.", "bad"); closeTimer(); }),
  "t-close": () => closeTimer(),
  "spin": () => spin(),
  "spin-done": () => {
    const res = R.result; if (!res) return;
    const d = day();
    if (res.paid) { d.spins++; S.totals.spins++; applyGain(25, 40, "ruleta"); }
    else { toast("Giro de práctica cumplido. Eso es actitud.", "cool"); }
    R.result = null; renderApp();
  },
  "spin-raja": () => {
    if (S.boss && !S.boss.defeated) S.boss.hp = Math.min(S.boss.max, S.boss.hp + 30);
    toast("Te rajaste. El rudo recupera 30.", "bad");
    R.result = null; save(); renderApp();
  },
  "edit-mask": () => {
    if (editingMask) { const inp = $("#v-name"); if (inp) { const v = inp.value.trim(); if (v) S.profile.name = v; } save(); }
    editingMask = !editingMask; renderApp();
  },
  "diff": b => { S.profile.diff = +b.dataset.i; save(); renderApp(); },
  "reset": b => armConfirm(b, "¿Seguro? Toca otra vez", async () => {
    S = null; OB = null; notices = []; R.result = null;
    try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
    clearTimeout(saveTimer);
    if (remote) { try { await remote.delete(); } catch (e) { /* ignore */ } }
    window.scrollTo(0, 0);
    startOnboarding();
  }),
  "modal-close": () => nextModal(),
  "notice-close": b => { notices.splice(+b.dataset.i, 1); renderApp(); }
};
function checkRitualFlags(d) {
  if (RITUALES.every(r => d.rit[r.id])) S.flags.rituales = true;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b, e);
});
document.addEventListener("input", e => {
  if (e.target.id === "v-name" && S) {
    const v = e.target.value.trim();
    if (v) { S.profile.name = v; clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 600); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) nextModal();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (T && !T.done) lockScreen();
    else if (S && !T) { ensureBoss(); renderApp(); }
  }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (TAB === "ruleta") drawWheel(); });

/* ================= start ================= */
const h = (location.hash || "").slice(1);
if (["arena", "combate", "ruleta", "vestidor"].includes(h)) TAB = h;
const local = loadLocal();
S = local && local.profile ? migrate(local) : null;
boot();
connectRemote();
})();
</script>
